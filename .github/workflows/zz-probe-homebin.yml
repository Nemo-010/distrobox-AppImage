name: Probe the storage driver with portable folders

on:
  push:

permissions:
  contents: read

jobs:
  probe:
    name: ${{ matrix.runs-on }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-22.04, ubuntu-24.04, ubuntu-latest]
    steps:
      - name: Install with portable folders
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          gh release download --repo pkgforge-dev/distrobox-AppImage \
            --pattern "*anylinux-$(uname -m).AppImage" --output "$HOME/bin/podman"
          chmod +x "$HOME/bin/podman"
          mkdir -p "$HOME/bin/podman.home" "$HOME/bin/podman.share" \
            "$HOME/bin/podman.cache" "$HOME/bin/podman.config"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          echo "DISABLE_AUTO_UPDATES=1" >> "$GITHUB_ENV"
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null)" = 1 ]; then
            printf 'abi <abi/4.0>,\ninclude <tunables/global>\n\nprofile podman "%s" flags=(unconfined) {\n  userns,\n}\n' \
              "$HOME/bin/podman" | sudo tee /etc/apparmor.d/podman-home > /dev/null
            sudo apparmor_parser -r /etc/apparmor.d/podman-home
          fi

      - name: Storage
        run: |
          set +e
          podman info --format 'driver: {{.Store.GraphDriverName}}'
          podman info --format 'graphroot: {{.Store.GraphRoot}}'
          podman info --format 'runroot: {{.Store.RunRoot}}'
          df -T "$HOME/bin" | tail -1

      - name: Build with a bind mount from a stage
        run: |
          set +e
          mkdir -p /tmp/ctx
          cat > /tmp/ctx/Containerfile <<'EOF'
          FROM docker.io/library/busybox:latest AS stage
          RUN mkdir -p /bins && echo hi > /bins/f
          FROM docker.io/library/busybox:latest
          RUN --mount=type=bind,from=stage,src=/bins,dst=/tmp/bins cp /tmp/bins/f /f
          EOF
          podman build --layers -t probe:local /tmp/ctx
          echo "build --layers exit: $?"
          podman build --platform linux/amd64 --layers -t probe:local2 /tmp/ctx
          echo "build --platform --layers exit: $?"
          echo secret > /tmp/secret.txt
          podman build --platform linux/amd64 --layers --secret=id=abc,type=file,src=/tmp/secret.txt -t probe:local3 /tmp/ctx
          echo "build with secret exit: $?"
