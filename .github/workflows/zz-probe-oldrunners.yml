name: Probe the AppImage on an old glibc

on:
  push:

permissions:
  contents: read

jobs:
  glibc:
    name: ubuntu:${{ matrix.tag }}
    runs-on: ubuntu-latest
    container: ubuntu:${{ matrix.tag }}
    strategy:
      fail-fast: false
      matrix:
        tag: ["20.04", "22.04"]
    steps:
      - name: Install curl
        run: |
          apt-get update -qq
          apt-get install -y -qq curl ca-certificates > /dev/null
          echo "glibc: $(ldd --version | head -1)"
          echo "curl: $(curl --version | head -1)"

      - name: Run the AppImage
        run: |
          set -euo pipefail
          mkdir -p /root/bin
          url=$(curl -fsSL https://api.github.com/repos/pkgforge-dev/distrobox-AppImage/releases/latest \
            | sed -n 's/.*"browser_download_url": "\([^"]*anylinux-x86_64\.AppImage\)".*/\1/p' | head -1)
          echo "url: $url"
          curl -fsSL -o /root/bin/podman "$url"
          chmod +x /root/bin/podman
          mkdir -p /root/bin/podman.home /root/bin/podman.share /root/bin/podman.cache /root/bin/podman.config
          DISABLE_AUTO_UPDATES=1 /root/bin/podman --version
