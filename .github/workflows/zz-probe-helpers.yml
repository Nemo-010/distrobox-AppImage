name: Probe which helpers podman takes from the host

on:
  push:

permissions:
  contents: read

jobs:
  probe:
    name: ${{ matrix.runs-on }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-22.04, ubuntu-24.04, ubuntu-latest]
    steps:
      - name: Install the AppImage built from fix/podman-bundled-crun
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 42296752890 --repo Nemo-010/distrobox-AppImage \
            --name AppImage-x86_64 --dir "$RUNNER_TEMP/art"
          sudo install -m 755 "$RUNNER_TEMP/art/"*.AppImage /usr/bin/podman
          echo "DISABLE_AUTO_UPDATES=1" >> "$GITHUB_ENV"
          podman info > /dev/null 2>&1 || podman system migrate --migrate-db

      - name: Pin conmon, catatonit and the runtime at the bundled ones
        run: |
          set -euo pipefail
          mount_bin=$(podman unshare printenv PATH | cut -d: -f1)
          sudo mkdir -p /etc/containers/containers.conf.d
          printf '[engine]\nconmon_path = ["%s/conmon"]\ninit_path = "%s/catatonit"\n[containers]\ninit_path = "%s/catatonit"\n' \
            "${mount_bin}" "${mount_bin}" "${mount_bin}" \
            | sudo tee /etc/containers/containers.conf.d/zz-appimage-podman.conf
          echo "conmon: $(podman info --format '{{.Host.Conmon.Path}}')"
          echo "runtime: $(podman info --format '{{.Host.OCIRuntime.Path}}')"

      - name: What the host ships
        run: |
          for b in conmon crun pasta slirp4netns netavark aardvark-dns catatonit newuidmap; do
            p=$(command -v "$b" || true)
            if [ -n "$p" ]; then
              echo "$b: $p $("$p" --version 2>&1 | head -1)"
            else
              echo "$b: not on the host"
            fi
          done

      - name: What podman reports
        run: |
          podman info --format '{{json .Host}}' | jq '{
            ociRuntime: .ociRuntime,
            conmon: .conmon,
            networkBackend: .networkBackend,
            networkBackendInfo: .networkBackendInfo,
            rootlessNetworkCmd: .rootlessNetworkCmd
          }'

      - name: What actually runs
        run: |
          set -euo pipefail
          mount_bin=$(podman unshare printenv PATH | cut -d: -f1)
          podman run -d --name probe --init docker.io/library/busybox:latest sleep 60
          podman run --rm --init docker.io/library/busybox:latest sh -c 'grep catatonit /proc/1/mountinfo' || true
          ps -eo args | grep -E "conmon|crun|pasta|slirp4netns|catatonit" | grep -v grep | cut -c1-160
          for name in catatonit conmon crun pasta; do
            for pid in $(pgrep -f "^$name" || true); do
              echo "$name pid $pid -> $(readlink /proc/$pid/exe)"
            done
          done
          podman rm -f probe
