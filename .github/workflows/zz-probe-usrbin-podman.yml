name: probe podman installed at /usr/bin/podman

on:
  push:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Baseline
        run: |
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          command -v podman || echo "no podman on PATH"
          ls -l /usr/bin/podman || echo "no /usr/bin/podman"
          /usr/bin/podman --version || true

      - name: Download AppImage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="$RUNNER_TEMP/podman"
          gh release download --repo pkgforge-dev/distrobox-AppImage \
            --pattern "*anylinux-$(uname -m).AppImage" \
            --output "$image"
          chmod +x "$image"
          "$image" --version

      - name: First rootless run from RUNNER_TEMP
        run: |
          set +e
          "$RUNNER_TEMP/podman" info > /dev/null
          echo "info from RUNNER_TEMP exit=$?"
          "$RUNNER_TEMP/podman" info > /dev/null
          echo "info from RUNNER_TEMP retry exit=$?"

      - name: Install to /usr/bin/podman and try again
        run: |
          sudo install -m 755 "$RUNNER_TEMP/podman" /usr/bin/podman
          hash -r
          command -v podman
          ls -l /usr/bin/podman
          set +e
          podman --version; echo "version exit=$?"
          podman info > /dev/null; echo "first info exit=$?"
          podman info > /dev/null; echo "second info exit=$?"
