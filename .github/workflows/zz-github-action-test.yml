name: Test the BlueBuild action with the AppImage podman

on:
  push:

permissions:
  contents: read

jobs:
  action:
    name: ${{ matrix.runs-on }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-22.04, ubuntu-24.04, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show the podman the runner ships
        run: |
          grep -E '^(ID|VERSION_ID)=' /etc/os-release
          podman --version || echo "no podman in the runner image"
          /usr/bin/crun --version 2>/dev/null | head -1 || echo "no crun in the runner image"

      - uses: ./action
        continue-on-error: true
        with:
          recipe: recipe.yml
          cosign_private_key: ${{ secrets.TEST_SIGNING_SECRET }}
          pr_event_number: "0"
          push: "false"
          squash: "true"
          skip_checkout: "true"

      - name: Dump what the build saw
        if: always()
        run: |
          set +e
          echo "PATH=$PATH"
          echo "podman: $(command -v podman) $(podman --version)"
          ls -la "$HOME/bin" | head -3
          echo "== temp dirs:"
          ls -d /tmp/bluebuild-tmp-* 2>/dev/null
          for f in /tmp/bluebuild-tmp-*/Containerfile*; do
            [ -f "$f" ] || continue
            echo "== $f"
            cat "$f"
          done

      - name: Check the podman the action installed
        run: |
          podman --version
          echo "DISABLE_AUTO_UPDATES=${DISABLE_AUTO_UPDATES:-unset}"
          ls -la /usr/bin/crun* 2>/dev/null || echo "no crun in /usr/bin"

  upstream:
    name: upstream action on ${{ matrix.runs-on }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: blue-build/github-action@main
        with:
          recipe: recipe.yml
          cosign_private_key: ${{ secrets.TEST_SIGNING_SECRET }}
          pr_event_number: "0"
          push: "false"
          squash: "true"
          skip_checkout: "true"
