name: Probe the host podman after the migration

on:
  push:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - name: Keep the host podman aside
        run: |
          set -euo pipefail
          sudo cp /usr/bin/podman /usr/bin/podman.distro
          echo "host podman: $(/usr/bin/podman.distro --version)"
          ls -la ~/.local/share/containers/storage/libpod/

      - name: Install the AppImage podman
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download --repo pkgforge-dev/distrobox-AppImage \
            --pattern "*anylinux-$(uname -m).AppImage" --output "$RUNNER_TEMP/podman"
          chmod +x "$RUNNER_TEMP/podman"
          sudo install -m 755 "$RUNNER_TEMP/podman" /usr/bin/podman
          echo "DISABLE_AUTO_UPDATES=1" >> "$GITHUB_ENV"

      - name: Migrate and use podman 6
        run: |
          set +e
          podman info > /dev/null 2>&1 || podman system migrate --migrate-db
          podman run --rm docker.io/library/busybox:latest echo from-podman-6
          echo "run exit: $?"
          podman ps -a
          echo "== libpod dir:"
          ls -la ~/.local/share/containers/storage/libpod/

      - name: The host podman again
        run: |
          set +e
          echo "== podman.distro info:"
          /usr/bin/podman.distro info > /dev/null
          echo "exit: $?"
          echo "== podman.distro ps -a:"
          /usr/bin/podman.distro ps -a
          echo "exit: $?"
          echo "== podman.distro images:"
          /usr/bin/podman.distro images
          echo "exit: $?"
          echo "== libpod dir after:"
          ls -la ~/.local/share/containers/storage/libpod/
