name: Test blue-build podman driver with the AppImage podman

on:
  push:

permissions: {}

jobs:
  podman:
    uses: ./.github/workflows/run-test.yml
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      repo: blue-build/cli
      ref: main
      registry_login: true
      run: test-podman-build
    secrets:
      TEST_SIGNING_SECRET: ${{ secrets.TEST_SIGNING_SECRET }}
