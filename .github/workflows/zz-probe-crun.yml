name: Probe crun resolution

on:
  push:

permissions:
  contents: read

jobs:
  probe:
    name: ${{ matrix.runs-on }} / ${{ matrix.variant }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-24.04, ubuntu-latest]
        variant: [default, env-runtime, no-host-crun]
    steps:
      - name: Install the AppImage podman
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download --repo pkgforge-dev/distrobox-AppImage \
            --pattern "*anylinux-$(uname -m).AppImage" --output "$RUNNER_TEMP/podman"
          chmod +x "$RUNNER_TEMP/podman"
          sudo install -m 755 "$RUNNER_TEMP/podman" /usr/bin/podman
          echo "DISABLE_AUTO_UPDATES=1" >> "$GITHUB_ENV"
          /usr/bin/crun --version 2>&1 | head -1 || echo "no host crun"

      - name: Apply the variant
        run: |
          set -euo pipefail
          case "${{ matrix.variant }}" in
            env-runtime)
              sudo mkdir -p /etc/containers/containers.conf.d
              printf '[engine]\nruntime = "$APPDIR/bin/crun"\n' \
                | sudo tee /etc/containers/containers.conf.d/zz-appimage-podman.conf
              ;;
            no-host-crun)
              sudo mv /usr/bin/crun /usr/bin/crun.hidden
              ;;
          esac

      - name: Resolved runtime
        run: podman info --format '{{.Host.OCIRuntime.Name}}|{{.Host.OCIRuntime.Path}}' 2>&1 | tail -2

      - name: Build with a RUN step
        run: |
          mkdir -p /tmp/ctx
          printf 'FROM docker.io/library/busybox:latest\nRUN echo hi > /hi\n' > /tmp/ctx/Containerfile
          podman build -t probe:local /tmp/ctx
