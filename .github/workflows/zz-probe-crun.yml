name: Probe the PATH the AppImage podman sees

on:
  push:

permissions:
  contents: read

jobs:
  probe:
    name: ${{ matrix.runs-on }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-22.04, ubuntu-24.04, ubuntu-latest]
    steps:
      - name: Install the AppImage podman
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download --repo pkgforge-dev/distrobox-AppImage \
            --pattern "*anylinux-$(uname -m).AppImage" --output "$RUNNER_TEMP/podman"
          chmod +x "$RUNNER_TEMP/podman"
          sudo install -m 755 "$RUNNER_TEMP/podman" /usr/bin/podman
          echo "DISABLE_AUTO_UPDATES=1" >> "$GITHUB_ENV"

      - name: What podman sees
        run: |
          echo "== shell PATH: ${PATH}"
          echo "== host crun: $(/usr/bin/crun --version 2>/dev/null | head -1 || echo none)"
          echo "== runtime path: $(podman info --format '{{.Host.OCIRuntime.Path}}' 2>&1 | tail -1)"
          echo "== PATH inside podman:"
          podman unshare printenv PATH || echo "podman unshare failed"
          echo "== crun that PATH finds inside podman:"
          podman unshare sh -c 'command -v crun; crun --version 2>&1 | head -1' || echo "podman unshare failed"
          echo "== CONTAINERS_CONF_OVERRIDE inside podman:"
          podman unshare printenv CONTAINERS_CONF_OVERRIDE || echo "unset"
          echo "== the override file:"
          podman unshare sh -c 'cat "$CONTAINERS_CONF_OVERRIDE"' || echo "none"
